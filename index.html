<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Naruto Project</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">
        🍥 Naruto Project
    </div>

    <nav>

        <a href="#">Início</a>
        <a href="#">Personagens</a>
        <a href="#">Vilas</a>

    </nav>

</header>

<section class="hero">

    <h1>Universo Naruto</h1>

    <p>

<section class="search-area">

        id="search"

        <option value="Todos">Todas as Vilas</option>

        <option value="Folha">

        </option>

        <option value="Areia">
            Vila da Areia
        </option>

        <option value="Névoa">
            Vila da Névoa
        </option>

        <option value="Nuvem">
            Vila da Nuvem
        </option>

        <option value="Pedra">
            Vila da Pedra
        </option>

        <option value="Akatsuki">
            Akatsuki
        </option>

    </select>

</section>

<main
id="container"
class="container">

<!-- Os cards serão inseridos pelo JavaScript -->

</main>

<footer>

    <p>
        Projeto feito com HTML, CSS e JavaScript.
    </p>

</footer>

<script src="script.js"></script>

</html>
